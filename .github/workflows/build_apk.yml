name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android files
        run: flutter create --platforms=android .

      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Set compileSdk to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text()
              updated, count = re.subn(
                  r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?).+$",
                  r"\g<1>36",
                  text,
              )

              if count:
                  path.write_text(updated)
                  print(f"Impostato compileSdk a 36 in {path}")
                  break
          else:
              raise SystemExit(
                  "Non trovo una riga compileSdk nei file Gradle dell'app"
              )
          PY

      - name: Set plugin compileSdk to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pub_cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          files = []

          for pattern in ("*/android/build.gradle", "*/android/build.gradle.kts"):
              files.extend(pub_cache.glob(pattern))

          changed = 0

          for path in files:
              text = path.read_text()
              updated, count = re.subn(
                  r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?).+$",
                  r"\g<1>36",
                  text,
              )

              if count:
                  path.write_text(updated)
                  changed += 1
                  print(f"Impostato compileSdk a 36 in {path}")

          if changed == 0:
              raise SystemExit(
                  "Non ho trovato righe compileSdk da aggiornare nei plugin"
              )
          PY

      - name: Verify compileSdk
        run: |
          grep -n "compileSdk" android/app/build.gradle* || true
          grep -R -n "compileSdk" "$HOME/.pub-cache/hosted/pub.dev/file_picker-"*/android/ || true

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          
