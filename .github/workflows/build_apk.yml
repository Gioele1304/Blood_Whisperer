name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android files
        run: flutter create --platforms=android .

      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36"

      - name: Set compileSdk to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          for path in files:
              if path.exists():
                  text = path.read_text()
                  updated, count = re.subn(
                      r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?).+$",
                      r"\g<1>36",
                      text,
                  )
                  if count:
                      path.write_text(updated)
                      print(f"Impostato compileSdk a 36 in {path}")
                      break
          else:
              raise SystemExit("Non trovo una riga compileSdk nei file Gradle Android")
          PY

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
