name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Blood_Whisperer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: Blood_Whisperer

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Generate Android structure and Get dependencies
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi
          flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: Blood_Whisperer/build/app/outputs/flutter-apk/app-release.apk
          
