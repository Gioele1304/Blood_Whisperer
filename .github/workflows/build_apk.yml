name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Fix Android and Build
        run: |
          # Controlla se esiste una sottocartella col nome del progetto e spostati lì dentro se necessario
          if [ -d "Blood_Whisperer" ]; then
            cd Blood_Whisperer
          fi

          # Se la cartella android non esiste, la crea correttamente
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi

          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
          
